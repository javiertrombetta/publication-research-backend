services:
  mysql:
    image: mysql:8.0.35
    container_name: publication-site-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: devpassword
      MYSQL_DATABASE: publication_site_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Builds and runs the exact image that ships to production (see src/PublicationSite.Api/Dockerfile),
  # so you can smoke-test it locally before pushing. Not required for day-to-day development;
  # `dotnet run` against the `mysql` service above (port 3306 on localhost) is faster to iterate on.
  api:
    build:
      context: ./src/PublicationSite.Api
      dockerfile: Dockerfile
    container_name: publication-site-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: "Server=mysql;Port=3306;Database=publication_site_dev;User=root;Password=devpassword;TreatTinyAsBoolean=true;"
      Jwt__Issuer: PublicationSite.Api.LocalDocker
      Jwt__Audience: PublicationSite.Client.LocalDocker
      # Dev-only key, same pattern as appsettings.Development.json. Never used outside this local container.
      Jwt__SigningKey: "0Shw8ESJkzqVKmveT8Us5z9zI002n+6rnANMtch+dOPgNFPFxqgB08duKAqM1yz7hCKz4ejAO0yf43REXLjZKQ=="
      Frontend__BaseUrl: "http://localhost:3000"
      # Off by default in Production; opted in here so the containerised image is browsable locally.
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"
    volumes:
      - api-uploads:/app/App_Data/uploads

volumes:
  mysql-data:
  api-uploads:
