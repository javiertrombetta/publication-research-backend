name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Pushing twice in quick succession should not leave the first run building something already
# replaced. The in-progress one is cancelled; tag builds are exempt, since a release is not
# superseded by whatever lands next.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOCKERHUB_IMAGE: javiertrombetta/publication-research-backend

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Restore pulls the same packages every run otherwise. Keyed on the project files, so it
      # only rebuilds when a dependency actually changes.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # Unit tests: fast, no external dependencies.
      # Integration tests: spin up a real MySQL via Testcontainers, which needs Docker —
      # already present on GitHub-hosted ubuntu runners, no extra setup required.
      - name: Test
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  build-and-push:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: src/PublicationSite.Api
          file: src/PublicationSite.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No provenance attestation. It costs time on every build and publishes the image as a
          # multi-manifest index carrying an "unknown/unknown" entry, which some registries and
          # deployment targets handle poorly. Nothing here consumes the attestation.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
