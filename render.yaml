# Render Blueprint — deploys the image GitHub Actions already built and pushed to Docker Hub
# (see .github/workflows/ci-cd.yml). Render does not build anything from source here.
#
# Usage: Render dashboard -> New -> Blueprint -> point at this repo. Render creates the
# service below; anything marked `sync: false` needs its value filled in by hand afterwards
# (Render dashboard -> service -> Environment) — those are secrets/deployment-specific values
# that don't belong committed to the repo. See docs/deployment.md for the full checklist.
#
# MySQL is not hosted by Render itself — ConnectionStrings__Default must point at an external
# MySQL instance (see docs/deployment.md for options).

services:
  - type: web
    name: publication-research-backend
    runtime: image
    image:
      url: docker.io/javiertrombetta/publication-research-backend:latest
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Swagger__Enabled
        value: "true"

      - key: ConnectionStrings__Default
        sync: false

      - key: Jwt__Issuer
        value: PublicationSite.Api
      - key: Jwt__Audience
        value: PublicationSite.Client
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__AccessTokenMinutes
        value: "30"
      - key: Jwt__RefreshTokenDays
        value: "14"

      - key: Frontend__BaseUrl
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false

      # No Mail__* here on purpose. The mail server is an administrator setting, edited under
      # System settings, and the stored value wins over configuration anyway. The seeded Admin
      # arrives with its address already confirmed, so nothing has to be emailed before someone
      # can sign in and set it up — there is nothing left for these to bootstrap.
      #
      # Setting them to placeholders is actively worse than leaving them out: SmtpEmailSender
      # only reports "no mail server is configured" while the host is empty, so a made-up host
      # turns a clear message into a connection timeout and a stack trace.

      # Bootstraps the single production Admin on first boot; safe to leave set afterwards
      # (DbSeeder never touches an existing account) but fine to clear once the account exists.
      - key: Seed__AdminEmail
        sync: false
      - key: Seed__AdminPassword
        sync: false

      # Fills an empty database with an account for every role and a publication at every stage
      # of the three pipelines, so the team can test the whole system without building a dataset
      # by hand. Every one of those accounts shares one published password.
      #
      # This blueprint describes the shared instance the team tests against, which is why it is
      # on. A production deployment REMOVES this key — the default outside development is off, so
      # the mistake of forgetting it costs sample data rather than opening a live site.
      - key: Seed__DemoData
        value: "true"

      # Lets an Admin call POST /api/dev/reset-database to wipe and reseed this instance —
      # meant for the team testing against a shared, disposable dataset. MUST be set to "false"
      # (or removed) once this deployment holds real user data.
      #
      # It also needs Seed__DemoData above: the reset refuses to run where no demonstration data
      # is seeded, since that is what marks a database as disposable. Belt and braces, because
      # this deletes everything and asks nothing first.
      - key: DevTools__EnableDatabaseReset
        value: "true"
